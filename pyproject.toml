[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-app"
version = "0.1.0"
description = "Privacy-first screenshot ingestion MVP"
requires-python = ">=3.11"

[project.scripts]
screenshot-import = "screenshot_app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
